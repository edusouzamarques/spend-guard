name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must match requires-python in pyproject.toml.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

  # The ledger is a file, and file behaviour is where platforms differ: newline
  # translation, fsync, and os.replace over an existing path. The package pins
  # newline="" on both read and write so a ledger written on one platform
  # replays on the other; that claim needs a Windows run to mean anything.
  windows:
    name: Python ${{ matrix.python-version }} on windows-latest
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

  optional-extras:
    name: Optional file formats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with every extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,toml,yaml]"

      - name: Test
        run: python -m pytest -q

  package:
    name: Build and import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel and run the entry point
        run: |
          python -m pip install dist/*.whl
          spend-guard --version
          spend-guard status --budget examples/budget.json --prices examples/prices.json
